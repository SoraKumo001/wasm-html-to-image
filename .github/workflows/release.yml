name: Release

on:
  push:
    branches:
      - master
    paths:
      - "packages/html-to-image/package.json"
  workflow_dispatch:

concurrency:
  group: release-wasm-html-to-image
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check package version and git tag
        id: check
        run: |
          VERSION=$(node -p "require('./packages/html-to-image/package.json').version")
          TAG="v$VERSION"
          echo "Package version: $VERSION"
          echo "Target tag: $TAG"

          EXISTS=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$EXISTS" ]; then
            echo "Tag $TAG already exists on remote. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG does not exist on remote. Proceeding with release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VCPKG_ROOT: /usr/local/share/vcpkg
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"
      VCPKG_DOWNLOADS: "${{ github.workspace }}/vcpkg_downloads"
      EMSDK_VERSION: "4.0.15"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Host C++ unit tests
        run: |
          cmake -S tests/cpp -B build-host-tests
          cmake --build build-host-tests
          ctest --test-dir build-host-tests -C Debug --output-on-failure

      - name: Build wasm
        uses: ./.github/actions/build-wasm
        with:
          emsdk-version: ${{ env.EMSDK_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Build JS Packages
        run: pnpm build:js

      - name: Run Unit Tests
        run: pnpm test

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.check-version.outputs.tag }}"
          git push origin "${{ needs.check-version.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.check-version.outputs.tag }}" \
            --title "${{ needs.check-version.outputs.tag }}" \
            --generate-notes

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: |
          npm install -g npm@latest
          pnpm --filter wasm-html-to-image publish --provenance --access public --no-git-checks
