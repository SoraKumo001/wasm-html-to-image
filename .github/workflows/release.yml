name: Release

on:
  push:
    branches:
      - master
    paths:
      - "packages/html-to-image/package.json"
  workflow_dispatch:

concurrency:
  group: release-wasm-html-to-image
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check package version and git tag
        id: check
        run: |
          VERSION=$(node -p "require('./packages/html-to-image/package.json').version")
          TAG="v$VERSION"
          echo "Package version: $VERSION"
          echo "Target tag: $TAG"

          EXISTS=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$EXISTS" ]; then
            echo "Tag $TAG already exists on remote. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG does not exist on remote. Proceeding with release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VCPKG_ROOT: /usr/local/share/vcpkg
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"
      VCPKG_DOWNLOADS: "${{ github.workspace }}/vcpkg_downloads"
      EMSDK_VERSION: "4.0.15"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache vcpkg downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg_downloads
          key: vcpkg-downloads-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-

      - name: Pre-download gumbo
        run: |
          mkdir -p ${{ github.workspace }}/vcpkg_downloads
          if [ ! -f ${{ github.workspace }}/vcpkg_downloads/gumbo-0.12.3.tar.gz ]; then
            curl -L --retry 5 --retry-delay 10 -o ${{ github.workspace }}/vcpkg_downloads/gumbo-0.12.3.tar.gz https://codeberg.org/gumbo-parser/gumbo-parser/archive/0.12.3.tar.gz
          fi

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'triplets/**') }}-
            vcpkg-${{ runner.os }}-

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-wasm
          max-size: 2G

      - name: Cache Emscripten
        uses: actions/cache@v6
        with:
          path: emsdk-cache
          key: ${{ runner.os }}-emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-emsdk-${{ env.EMSDK_VERSION }}-

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: "emsdk-cache"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Cache Skia Source
        uses: actions/cache@v6
        with:
          path: build/_deps/skia-src
          key: skia-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            skia-

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wasm Configure
        run: pnpm wasm:configure
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache

      - name: Wasm Build
        run: pnpm wasm:build

      - name: Build JS Packages
        run: pnpm build:js

      - name: Run Unit Tests
        run: pnpm test

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.check-version.outputs.tag }}"
          git push origin "${{ needs.check-version.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.check-version.outputs.tag }}" \
            --title "${{ needs.check-version.outputs.tag }}" \
            --generate-notes

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: |
          npm install -g npm@latest
          pnpm --filter wasm-html-to-image publish --provenance --access public --no-git-checks
