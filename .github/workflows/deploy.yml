name: Deploy to GitHub Pages

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: /usr/local/share/vcpkg
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"
      VCPKG_DOWNLOADS: "${{ github.workspace }}/vcpkg_downloads"
      EMSDK_VERSION: "4.0.15"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_downloads
          key: vcpkg-downloads-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-

      - name: Pre-download gumbo
        run: |
          mkdir -p ${{ github.workspace }}/vcpkg_downloads
          if [ ! -f ${{ github.workspace }}/vcpkg_downloads/gumbo-0.12.3.tar.gz ]; then
            curl -L --retry 5 --retry-delay 10 -o ${{ github.workspace }}/vcpkg_downloads/gumbo-0.12.3.tar.gz https://codeberg.org/gumbo-parser/gumbo-parser/archive/0.12.3.tar.gz
          fi

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'triplets/**') }}-
            vcpkg-${{ runner.os }}-

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-wasm
          max-size: 2G

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: emsdk-cache
          key: ${{ runner.os }}-emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-emsdk-${{ env.EMSDK_VERSION }}-

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: "emsdk-cache"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cache Skia Source
        uses: actions/cache@v4
        with:
          path: build/_deps/skia-src
          key: skia-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            skia-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wasm Configure
        run: pnpm wasm:configure
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache

      - name: Wasm Build
        run: pnpm wasm:build

      - name: ccache stats
        run: ccache -s

      - name: Build JS Packages
        run: |
          pnpm build:js
          pnpm --filter playground build

      - name: Run Unit Tests
        run: pnpm test

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/visual-test/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter visual-test exec playwright install chromium --with-deps

      - name: Generate Reference PNGs
        run: pnpm --filter visual-test generate-reference

      - name: Run Visual Tests
        run: pnpm test:visual

      - name: Run Smoke Tests
        run: pnpm test:smoke

      - name: Build Docs
        run: pnpm docs:build
        env:
          DOCUSAURUS_BASE_URL: /wasm-html-to-image/${{ github.ref_name }}/docs/

      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DEPLOY_DIR=$(mktemp -d)

          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages:gh-pages
            git worktree add "$DEPLOY_DIR" gh-pages
          else
            git worktree add --orphan -B gh-pages "$DEPLOY_DIR"
          fi

          rm -rf "$DEPLOY_DIR/${{ github.ref_name }}"
          mkdir -p "$DEPLOY_DIR/${{ github.ref_name }}"
          cp -r packages/playground/dist/* "$DEPLOY_DIR/${{ github.ref_name }}/"
          mkdir -p "$DEPLOY_DIR/${{ github.ref_name }}/docs"
          cp -r packages/docs/build/* "$DEPLOY_DIR/${{ github.ref_name }}/docs/"

          cd "$DEPLOY_DIR"

          # Generate index.html
          echo "<!DOCTYPE html><html><head><title>wasm-html-to-image - Branch Previews</title>" > index.html
          echo "<style>body{font-family:sans-serif;padding:40px;line-height:1.6;}ul{list-style:none;padding:0;}li{margin:10px 0;}a{text-decoration:none;color:#0366d6;}a:hover{text-decoration:underline;}</style>" >> index.html
          echo "</head><body><h1>wasm-html-to-image Previews</h1><ul>" >> index.html

          BRANCHES=$(git ls-remote --heads origin | awk -F'refs/heads/' '{print $2}')
          for d in */ ; do
            BN=$(basename "$d")
            if [ "$BN" != "node_modules" ] && [ "$BN" != "assets" ] && [ -d "$d" ]; then
              if echo "$BRANCHES" | grep -qxw "$BN"; then
                echo "<li><a href=\"./$BN/\">$BN (Playground)</a> | <a href=\"./$BN/docs/\">Docs</a></li>" >> index.html
              fi
            fi
          done
          echo "</ul></body></html>" >> index.html

          git add -A
          if git diff --staged --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy ${{ github.ref_name }} and update index page"
            for i in {1..10}; do
              if git push origin gh-pages; then
                echo "Successfully deployed to gh-pages."
                break
              fi
              echo "Push conflict, retrying in $(( i * 2 ))s..."
              git pull --rebase origin gh-pages || true
              sleep $(( i * 2 ))
            done
          fi

          cd -
          git worktree remove --force "$DEPLOY_DIR" || true
