name: Deploy to GitHub Pages

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: /usr/local/share/vcpkg
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"
      VCPKG_DOWNLOADS: "${{ github.workspace }}/vcpkg_downloads"
      EMSDK_VERSION: "4.0.15"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Host C++ unit tests
        run: |
          cmake -S tests/cpp -B build-host-tests
          cmake --build build-host-tests
          ctest --test-dir build-host-tests -C Debug --output-on-failure

      - name: Build wasm
        uses: ./.github/actions/build-wasm
        with:
          emsdk-version: ${{ env.EMSDK_VERSION }}

      - name: Build JS Packages
        run: |
          pnpm build:js
          pnpm --filter playground build

      - name: Run Unit Tests
        run: pnpm test

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/visual-test/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter visual-test exec playwright install chromium --with-deps

      - name: Generate Reference PNGs
        run: pnpm --filter visual-test generate-reference

      - name: Run Visual Tests
        run: pnpm test:visual

      - name: Run Smoke Tests
        run: pnpm test:smoke

      - name: Build Docs
        run: pnpm docs:build
        env:
          DOCUSAURUS_BASE_URL: /wasm-html-to-image/${{ github.ref_name }}/docs/

      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DEPLOY_DIR=$(mktemp -d)

          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages:gh-pages
            git worktree add "$DEPLOY_DIR" gh-pages
          else
            git worktree add --orphan -B gh-pages "$DEPLOY_DIR"
          fi

          rm -rf "$DEPLOY_DIR/${{ github.ref_name }}"
          mkdir -p "$DEPLOY_DIR/${{ github.ref_name }}"
          cp -r packages/playground/dist/* "$DEPLOY_DIR/${{ github.ref_name }}/"
          mkdir -p "$DEPLOY_DIR/${{ github.ref_name }}/docs"
          cp -r packages/docs/build/* "$DEPLOY_DIR/${{ github.ref_name }}/docs/"

          cd "$DEPLOY_DIR"

          # Generate index.html
          echo "<!DOCTYPE html><html><head><title>wasm-html-to-image - Branch Previews</title>" > index.html
          echo "<style>body{font-family:sans-serif;padding:40px;line-height:1.6;}ul{list-style:none;padding:0;}li{margin:10px 0;}a{text-decoration:none;color:#0366d6;}a:hover{text-decoration:underline;}</style>" >> index.html
          echo "</head><body><h1>wasm-html-to-image Previews</h1><ul>" >> index.html

          BRANCHES=$(git ls-remote --heads origin | awk -F'refs/heads/' '{print $2}')
          for d in */ ; do
            BN=$(basename "$d")
            if [ "$BN" != "node_modules" ] && [ "$BN" != "assets" ] && [ -d "$d" ]; then
              if echo "$BRANCHES" | grep -qxw "$BN"; then
                echo "<li><a href=\"./$BN/\">$BN (Playground)</a> | <a href=\"./$BN/docs/\">Docs</a></li>" >> index.html
              fi
            fi
          done
          echo "</ul></body></html>" >> index.html

          git add -A
          if git diff --staged --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy ${{ github.ref_name }} and update index page"
            for i in {1..10}; do
              if git push origin gh-pages; then
                echo "Successfully deployed to gh-pages."
                break
              fi
              echo "Push conflict, retrying in $(( i * 2 ))s..."
              git pull --rebase origin gh-pages || true
              sleep $(( i * 2 ))
            done
          fi

          cd -
          git worktree remove --force "$DEPLOY_DIR" || true
