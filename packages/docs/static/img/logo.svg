<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="20" y="20" width="160" height="160" rx="36" fill="#0f172a" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

  <!-- Code brackets (HTML) -->
  <path d="M55 75 L35 100 L55 125" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  
  <!-- Image Frame / Photo Graphic -->
  <rect x="75" y="55" width="90" height="90" rx="16" fill="url(#primaryGrad)" />
  
  <!-- Sun / Moon in image -->
  <circle cx="140" cy="80" r="10" fill="#fef08a" />
  
  <!-- Mountains / Horizon in image -->
  <path d="M75 125 L105 95 L125 115 L145 90 L165 115 L165 130 C165 138.837 157.837 145 149 145 L91 145 C82.163 145 75 138.837 75 130 Z" fill="#0f172a" opacity="0.65" />

  <!-- WASM gear / bolt overlay accent -->
  <circle cx="75" cy="140" r="16" fill="url(#accentGrad)" filter="url(#glow)" />
  <path d="M75 132 L71 141 L76 141 L74 148 L79 139 L74 139 Z" fill="#ffffff" />
</svg>
