</style></head><body><div class="v" style="height:420px;width:760px;padding:16px;background:#fffbeb;border:1px solid #d6b656;font-size:18px;line-height:1.9"><h1 style="font-size:28px;margin:0 0 0 16px">吾輩は猫である</h1><p style="margin:0 0 0 16px;font-size:14px">夏目漱石</p><p style="margin:0;text-indent:1em">吾輩は猫である。名前はまだ無い。どこで生れたかとんと見当がつかぬ。何でも薄暗いじめじめした所でニャーニャー泣いていた事だけは記憶している。吾輩は猫である。名前はまだ無い。どこで生れたかとんと見当がつかぬ。何でも薄暗いじめじめした所でニャーニャー泣いていた事だけは記憶している。</p><p style="margin:0;text-indent:1em">吾輩はここで始めて人間というものを見た。しかもあとで聞くとそれは書生という人間中で一番<ruby>獰悪<rt>どうあく</rt></ruby>な種族であったそうだ。第<span style="text-combine-upright:all">1</span>章、<span style="text-combine-upright:all">2024</span>年。</p></div></body></html>
