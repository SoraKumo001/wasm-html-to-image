<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Reference-font pinning for the real-page tools (score / diff / fuzz), wired into
  every Chromium launch by launchChromium() in lib.mts via FONTCONFIG_FILE.

  Which physical font a name like "Arial" resolves to depends on the machine, and
  with it the reference line heights and advances the engine is graded against.
  The Liberation family is metric-compatible with Arial / Times New Roman /
  Courier New, exactly the fonts the engine's metric profiles model, so
  pinning those names (and the generic families, for fontconfig consumers that
  honour them) to Liberation makes the reference render with the metrics the
  engine assumes, on any Linux machine. Machines without Liberation installed
  fall through to their usual substitution. The system configuration is
  included first for the font inventory and non-Latin fallbacks.
-->
<fontconfig>
  <include>/etc/fonts/fonts.conf</include>

  <alias binding="strong"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Helvetica Neue</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>Times</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>Courier New</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="strong"><family>Courier</family><prefer><family>Liberation Mono</family></prefer></alias>

  <alias binding="strong"><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
